<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 220px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fffbea;
      color: #3b2a00;
      border-top: 4px solid #4a9a3f;
    }
    h3 { margin: 0 0 10px; font-size: 15px; color: #3b2a00; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #f5c518;
      color: #3b2a00;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover { background: #e0b000; }
    button:disabled { background: #e8e0c0; color: #a89c6a; cursor: not-allowed; }
    a {
      display: block;
      text-align: center;
      color: #7a6520;
      font-size: 12px;
      text-decoration: none;
      margin-top: 4px;
    }
    a:hover { text-decoration: underline; color: #4a9a3f; }
    #status { font-size: 12px; color: #7a6520; margin-top: 6px; min-height: 14px; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; font-size: 12px; color: #5c4a10;
    }
    .toggle-row input { accent-color: #4a9a3f; }
    #usageBox {
      background: #fff3c4;
      border: 1px solid #ecd576;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    #usageText { font-size: 12px; color: #5c4a10; }
    #usageBar {
      height: 5px;
      background: #f3e6a8;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    #usageBarFill {
      height: 100%;
      background: #4a9a3f;
      width: 0%;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <h3>askSnip</h3>

  <div id="usageBox">
    <div id="usageText">Loading usage…</div>
    <div id="usageBar"><div id="usageBarFill"></div></div>
  </div>

  <label class="toggle-row">
    Ask custom question
    <input type="checkbox" id="customToggle" />
  </label>
  <button id="startBtn">Start Snip</button>
  <div id="status"></div>
  <a id="optionsLink" href="#">Settings (API key)</a>
  <script src="popup.js"></script>
</body>
</html>
